data:
  pdb_dir: data/pdb
  processed_dir: data/processed
  k_neighbors: 30
  rwse_steps: 16

model:
  num_layers: 3
  node_scalar_in: 43      # 21 AA + 6 torsion + 16 RWSE
  node_vector_in: 3       # backbone frame vectors
  edge_scalar_in: 16      # RBF distances
  edge_vector_in: 1       # direction vector
  hidden_scalar: 128
  hidden_vector: 16
  output_dim: 512
  dropout: 0.1

training:
  batch_size: 32
  max_epochs: 100
  lr: 0.0001
  weight_decay: 0.01
  mask_rate: 0.15
  grad_clip: 1.0
  checkpoint_dir: checkpoints
  log_every: 50
