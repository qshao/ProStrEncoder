# configs/large.yaml — 860M parameter tier
# Launch: torchrun --nproc_per_node=4 scripts/train.py --config configs/large.yaml

data:
  pdb_dir: data/pdb
  processed_dir: data/processed
  train_dir: data/processed/train
  val_dir: data/processed/val
  k_neighbors: 30
  max_len: 1024
  min_len: 40
  resolution_cutoff: 3.5
  min_chain_coverage: 0.9
  cluster_seqid: 0.30
  preprocess_workers: 16
  dataset_format: random_access

model:
  num_layers: 8
  node_scalar_in: 283        # 27 + walk_embed_dim(256)
  node_vector_in: 3
  edge_scalar_in: 16
  edge_vector_in: 1
  hidden_scalar: 512
  hidden_vector: 64
  output_dim: 1024
  dropout: 0.1
  num_walks: 8
  walk_length: 20
  walk_embed_dim: 256
  walk_layers: 8
  walk_heads: 8
  max_deg_cap: 30
  tx_layers: 24
  tx_d_model: 1024
  tx_num_heads: 16
  tx_ff_mult: 4
  tx_dropout: 0.1
  attn_window_size: -1
  gradient_checkpointing: true

training:
  batch_size: 16
  max_epochs: 100
  lr: 2.0e-4
  weight_decay: 0.01
  mask_rate: 0.15
  grad_clip: 1.0
  checkpoint_dir: checkpoints/large
  log_every: 50
  num_workers: 4
  precision: bf16
  gvp_lr_multiplier: 0.1
  warmup_phase_fraction: 0.05
  inverse_fold_prob: 0.3
  inverse_fold_weight: 1.0
  save_every_steps: 500
  device_strategy: ddp
  wandb: false
  wandb_project: prostrencoder

evaluation:
  probe_epochs: 100
  probe_lr: 0.01
  probe_weight_decay: 0.0001
